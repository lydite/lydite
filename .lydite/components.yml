# What lydite builds, tests, scans and gates in its own repository.
#
# Two components, because a component is the unit its build tool treats as a
# whole: the Go module at source/cli/ is what `go test` treats as one, and
# source/cloud-services/ is one npm workspace. The Workers and the library they
# share are three packages in that workspace and deliberately not three
# components — declared separately, npm would install and build the workspace
# three times, and each copy would provision everything the suite needs again.
#
# The *-pin directories under it hold real manifests — a go.mod, a
# package.json, a Cargo.toml — and are deliberately not components: they exist
# so Dependabot can see the tool versions lydite pins, and nothing in them is
# ever built or tested. Being undeclared is the whole of what keeps them out of
# scope: lydite reads this file rather than walking for manifests. A cargo pin
# is the exception — see the exclude below. Adding one still means adding a
# matching entry to .github/dependabot.yml, which nothing enforces — a pin no
# bot bumps is a scanner that quietly goes stale.
components:
  - name: cli
    dir: source/cli
    runner: go-test
    args: ["-race", "./..."]

  - name: cloud-services
    dir: source/cloud-services
    runner: vitest
    # No args. The vitest runner supplies `run` itself, because a bare `vitest`
    # starts watch mode and must never be a CI default — and a second `run`
    # here is not ignored: vitest reads a positional argument as a filename
    # filter, so it would select no test file and the component would fail with
    # "No test files found".

# The pin manifests' own source. cargo refuses a [package] manifest with no
# src/lib.rs, so cargo-audit-pin and cargo-deny-pin each carry an empty one —
# real Rust that no component builds, tests or scans, and this is where a
# repository says that out loud. Without it `lydite scan` reports Rust source
# that nothing checks, which is true and is not something anyone should fix.
excludes: ["source/cli/internal/**/*-pin/**"]
