# Managed by gt — edit .gt-repo.yaml, then run `gt repo sync`.
#
# What lydite lets merge without a human reading it. A change merges unread
# only when a single entry covers every path it touched and that entry's
# condition holds; everything else is referred.
#
# dependency-version-bump is derived from the dependabot: block. It lists only
# files lydite reads a version comparison from — never Cargo.toml or
# package.json, so an edit to one of those alone stays referred — and
# ecosystems lydite cannot read contribute nothing. Turn it off with
# lydite.exempt_dependency_bumps: false, and add repository-specific entries
# under lydite.exemptions.
#
# lydite reads this file from the base commit and refers any pull request that
# changes it, which then needs a `/lydite clear`. Keep such a pull request to
# this file alone.
exemptions:
  - name: dependency-version-bump
    reason: 'A version bump of a dependency the base already declares, in a file lydite reads a version comparison from on both sides. A bump is exempt only when it stays within patch or minor and its licence and SCA rows are green, whoever wrote it. Rendered by gt from the dependabot: block of .gt-repo.yaml.'
    paths:
      - source/cli/go.mod
      - source/cli/go.sum
      - source/cli/internal/golang/go-pin/go.mod
      - source/cli/internal/golang/go-pin/go.sum
      - source/cli/internal/runner/cargo-llvm-cov-pin/Cargo.lock
      - source/cli/internal/runner/cargo-nextest-pin/Cargo.lock
      - source/cli/internal/runner/gotestsum-pin/go.mod
      - source/cli/internal/runner/gotestsum-pin/go.sum
      - source/cli/internal/rust/cargo-audit-pin/Cargo.lock
      - source/cli/internal/rust/cargo-deny-pin/Cargo.lock
      - source/cli/internal/rust/cargo-semver-checks-pin/Cargo.lock
      - source/cli/internal/secrets/gitleaks-pin/go.mod
      - source/cli/internal/secrets/gitleaks-pin/go.sum
      - source/cli/internal/typescript/api-extractor-pin/package-lock.json
      - source/cli/internal/typescript/biome-pin/package-lock.json
      - source/cloud-services/package-lock.json
      - source/web/package-lock.json
    versions: patch-and-minor
