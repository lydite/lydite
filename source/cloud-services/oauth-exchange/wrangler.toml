name = "lydite-oauth-exchange"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

[[routes]]
pattern = "app.lydite.org"
custom_domain = true

# The sign-in is Worker-driven and runs on this one origin: /auth/login,
# /auth/callback, /auth/refresh and /auth/logout. The redirect URI is derived
# from the request's own origin, so no URL is configured here. The refresh token
# lives only in an HttpOnly cookie; the Worker has no storage binding.
[vars]
LYDITE_DASHBOARD_CLIENT_ID = ""

# LYDITE_DASHBOARD_CLIENT_SECRET is this Worker's own secret. The dashboard App
# has no private key at all: the user-to-server flow needs a client id and
# secret, and a key it never uses would be liability rather than capability.
