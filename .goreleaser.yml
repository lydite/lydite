# goreleaser configuration for lydite.
#
# Builds a single binary, `lydite`, from ./cmd/lydite. It runs both as a
# local developer tool (self-updates via `lydite update`) and inside CI via
# the reusable workflows / composite action in this repo, so it ships for
# both linux and darwin.
version: 2

before:
  hooks:
    # `-C source/cli` is load-bearing. The Go module lives in source/cli/, not
    # at the repository root, and a before-hook runs at the root with no shell,
    # so neither a bare `go mod tidy` nor a `cd` in front of it works: the hook
    # fails with "go.mod file not found" and the release ends before a single
    # binary is built.
    - go -C source/cli mod tidy

builds:
  - id: lydite
    dir: source/cli
    main: ./cmd/lydite
    binary: lydite
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # The grammar tables mutation parses Rust and TypeScript with. gotreesitter
    # embeds all 206 of its grammars by default, which is 20MB of blobs in a
    # binary that parses three languages — measured at 45MB against 25MB here.
    #
    # Both halves of the tag list are load-bearing. `grammar_subset` switches
    # the wildcard embed off; each `grammar_subset_<lang>` tag switches one
    # blob back on, and a language named nowhere here fails at its first parse
    # rather than at build time. `ci-test.yml` runs the suite under these exact
    # tags for that reason: a bare `go test` embeds everything and so cannot
    # see a missing one.
    tags:
      - grammar_subset
      - grammar_subset_rust
      - grammar_subset_typescript
      - grammar_subset_tsx

# One archive so consumers get everything, plus a raw uncompressed binary for
# curl-and-run / CI usage that doesn't want an extraction step.
archives:
  - id: lydite
    ids:
      - lydite
    name_template: >-
      lydite_{{ .Version }}_{{ .Os }}_{{ .Arch }}

  - id: raw
    ids:
      - lydite
    formats:
      - binary
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: lydite
    name: lydite
  extra_files:
    - glob: scripts/install.sh
  # No `header:` here. The release body's header is assembled by release.yml
  # and passed with --release-header, so it can carry that version's notes from
  # docs/release-notes/<tag>.md above the generated commit changelog. A commit
  # list cannot explain a change in what a number means, which is the whole
  # reason those files exist; docs/release-notes/_header.md holds the invariant
  # preamble the assembled header starts with.
