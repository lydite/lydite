# Posts lydite's standing comment: through the relay, or with the workflow's
# own token.
#
# The relay is preferred because it is the identity half of the design — the
# comment arrives as `lydite`, and this job holds no credential that could
# write anywhere. What it presents is the Actions OIDC token GitHub minted for
# this run, which grants nothing by itself: the relay decides which repository
# and which pull request may be written to from the claims GitHub signed.
#
# The fallback is required rather than a stopgap, but it is not the answer to
# every status. A consumer who has installed nothing still gets a comment, from
# `github-actions[bot]`, and the only thing they lose is whose name is on it; a
# consumer who has configured the relay wrongly gets a red step instead,
# because a fallback there posts the right verdict under the wrong byline on
# every run and never once says so. The relay's answer sorts into three:
#
#   - No relay configured, or 409 — the App is not installed on this
#     repository. Both fall back silently; the second is the ordinary state of
#     every repository that has not opted in.
#   - A 5xx, or curl's `000` for a relay it could not reach at all. Falls back,
#     under a `::warning::`: a lydite outage must not fail a consumer's pull
#     request, and must not pass unremarked either.
#   - Anything else — 401 for a token the relay would not verify, 400 for a
#     payload it would not read, 403 for a run whose `ref` is not a pull
#     request's or whose number does not match it. Each is deterministic, so
#     the next run answers the same. The step fails.
#
# `/comment` is stricter about 403 than `/review` is, and deliberately: the
# id-not-on-this-pull-request check that makes a 403 ambiguous exists only on
# `/review`, so a 403 here can only be the ref or the number, and only here can
# a 403 be failed on without failing a live race.
#
# A fork's pull request is untouched by any of this. It cannot mint an OIDC
# token, so it fails at the mint below, under `set -e`, before a status exists
# to sort.
#
# Nothing here interpolates an expression into a `run:` body. Every value
# arrives through `env:` and is referenced as a shell variable — Semgrep's
# yaml.github-actions.security.run-shell-injection rule has caught that exact
# mistake in a lydite action before, and a comment body is the most
# attacker-shaped value in this repository: it quotes a pull request's own
# source.
name: lydite comment
description: Post or edit lydite's standing pull-request comment

inputs:
  body-file:
    description: file holding the rendered comment
    required: true
  pull-request:
    description: the pull request to comment on
    required: true
  relay:
    description: the relay's origin; empty falls straight back to the workflow's token
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: relay
      if: inputs.relay != ''
      shell: bash
      env:
        BODY_FILE: ${{ inputs.body-file }}
        NUMBER: ${{ inputs.pull-request }}
        RELAY: ${{ inputs.relay }}
      run: |
        set -euo pipefail

        # The marker is the comment's own first line, read back rather than
        # restated here. It is `ui.Marker`, and a second copy of it in a
        # workflow is a copy that can disagree — the run would then post a
        # fresh comment every time instead of editing the standing one.
        marker=$(head -n 1 "$BODY_FILE")
        case "$marker" in
          '<!-- lydite:'*'-->') ;;
          *) echo "the rendered comment does not begin with lydite's marker" >&2; exit 1 ;;
        esac

        # The OIDC token is requested for the relay's own origin as the
        # audience, so a token minted here cannot be replayed against another
        # service — and the relay refuses one whose audience is not its own.
        token=$(curl -fsS \
          -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${RELAY}" | jq -r '.value')

        jq -n --arg marker "$marker" --arg body "$(cat "$BODY_FILE")" --argjson pr "$NUMBER" \
          '{marker: $marker, body: $body, pull_request: $pr}' > "${RUNNER_TEMP}/relay.json"

        # The repository is deliberately not sent. The relay takes it from the
        # verified claim, so there is nothing here that could name another one.
        status=$(curl -sS -o "${RUNNER_TEMP}/relay-out.json" -w '%{http_code}' \
          -X POST "${RELAY}/comment" \
          -H "Authorization: Bearer ${token}" \
          -H 'content-type: application/json' \
          --data-binary "@${RUNNER_TEMP}/relay.json") || status=000

        if [ "$status" = "200" ]; then
          echo "posted=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        case "$status" in
          409)
            echo "posted=false" >> "$GITHUB_OUTPUT"
            echo "the relay answered ${status}; falling back to this workflow's token" >&2
            ;;
          000|5??)
            echo "posted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the relay answered ${status}; falling back to this workflow's token" >&2
            ;;
          *)
            # No `posted` output: the step's own failure is the whole of what
            # this branch says, and it skips the fallback step below rather
            # than choosing for it.
            echo "::error::the relay answered ${status}; this is a configuration problem, not an outage, so it fails the step rather than falling back" >&2
            cat "${RUNNER_TEMP}/relay-out.json" >&2 || true
            exit 1
            ;;
        esac
        cat "${RUNNER_TEMP}/relay-out.json" >&2 || true

    - if: steps.relay.outputs.posted != 'true'
      shell: bash
      env:
        BODY_FILE: ${{ inputs.body-file }}
        NUMBER: ${{ inputs.pull-request }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        marker=$(head -n 1 "$BODY_FILE")
        case "$marker" in
          '<!-- lydite:'*'-->') ;;
          *) echo "the rendered comment does not begin with lydite's marker" >&2; exit 1 ;;
        esac

        # Found by the marker and not by author, which is what lets the relay
        # later take over a comment this path posted rather than orphaning it
        # and leaving two standing verdicts on the pull request.
        #
        # The marker has to *open* the body, and `startswith` rather than
        # `contains` is the whole of what keeps this from writing over
        # somebody. The platform's quote-reply copies the raw markdown of the
        # comment it answers, HTML comment included, so on a pull request
        # lydite has not commented on yet, a person quoting the verdict would
        # otherwise be the comment this step PATCHes wholesale — with the
        # `pull-requests: write` token above. `lydite publish` writes the
        # marker as the body's first line, which the case statement above has
        # already checked, so nothing lydite posts is lost by asking.
        #
        # The same rule, in the same words, lives in forge.FindComment and in
        # the relay's findComment. Three implementations of one upsert is what
        # ADR 0022's two identities cost; they have to agree.
        existing=$(gh api --paginate \
          "repos/${REPO}/issues/${NUMBER}/comments" \
          --jq "map(select((.body // \"\") | startswith(\"${marker}\"))) | .[0].id // empty")

        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" \
            -F "body=@${BODY_FILE}" --silent
          echo "edited comment ${existing}"
        else
          gh api -X POST "repos/${REPO}/issues/${NUMBER}/comments" \
            -F "body=@${BODY_FILE}" --silent
          echo "created a comment"
        fi
