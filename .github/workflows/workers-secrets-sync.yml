# Replicates the Workers' secrets from GitHub to Cloudflare.
#
# GitHub is the single source of truth and Cloudflare is a replica. The
# Cloudflare API token has to be in GitHub anyway for deployment, so holding the
# App credentials anywhere else would mean two stores to rotate and one that
# drifts silently — and a credential that has drifted fails at the moment it is
# used, which for the relay is somebody's pull request.
#
# **Each Worker receives only its own App's credential.** `pr-relay` gets the
# `lydite` App's private key and never the dashboard's client secret. That is
# the whole reason there are two Apps: a compromised posting relay must not be
# able to read anyone's source. Per-Worker secrets rather than an account-level
# store is what makes that structural rather than merely intended — a shared
# store would give both Workers both credentials and leave the two-App split
# with nothing behind it.
#
# Manual, and deliberately not part of the deploy. Rotating a credential is a
# decision somebody takes, and a deploy that pushed secrets every time would
# make every release a credential write.
name: workers secrets sync

on:
  workflow_dispatch:
    inputs:
      worker:
        description: which Worker's secrets to replace
        required: true
        type: choice
        options:
          - pr-relay
          - oauth-exchange

permissions:
  contents: read

jobs:
  sync:
    name: sync ${{ inputs.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: source/cloud-services/package.json

      - name: install
        working-directory: source/cloud-services
        run: npm ci

      # `wrangler secret bulk` reads a JSON object from stdin, so the values
      # never appear in an argument list — an argv is visible to anything that
      # can read /proc on the runner, and to the run log if a step ever echoes
      # its command.
      #
      # Every value reaches this script through `env:` and is referenced as a
      # shell variable. Interpolating `${{ secrets.* }}` into a `run:` body
      # splices the secret into text a shell then parses, which is a script
      # injection for any value containing shell metacharacters — and a PEM
      # private key is multi-line text. Semgrep's
      # yaml.github-actions.security.run-shell-injection rule has caught that
      # mistake in a lydite workflow before.
      - name: replace the Worker's secrets
        working-directory: source/cloud-services/${{ inputs.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ inputs.worker }}
          # Read for both Workers and handed to one. Which of the two the
          # script actually sends is decided below, so the branch that chooses
          # is visible in one place rather than spread across two jobs that
          # could come apart.
          APP_PRIVATE_KEY: ${{ secrets.LYDITE_APP_PRIVATE_KEY }}
          DASHBOARD_CLIENT_SECRET: ${{ secrets.LYDITE_DASHBOARD_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          case "$WORKER" in
            pr-relay)
              # The key must be PKCS#8. GitHub issues an App's key as PKCS#1
              # and WebCrypto imports only PKCS#8, so the conversion is done
              # once before the secret is stored:
              #
              #   openssl pkcs8 -topk8 -nocrypt -in app.pem -out app.pkcs8.pem
              #
              # Checked here rather than left to fail at runtime, where it
              # surfaces as a relay that cannot post and a pull request with no
              # comment.
              case "$APP_PRIVATE_KEY" in
                *"BEGIN RSA PRIVATE KEY"*)
                  echo "LYDITE_APP_PRIVATE_KEY is PKCS#1; store the PKCS#8 form instead" >&2
                  echo "  openssl pkcs8 -topk8 -nocrypt -in app.pem -out app.pkcs8.pem" >&2
                  exit 1
                  ;;
                *"BEGIN PRIVATE KEY"*) ;;
                *)
                  echo "LYDITE_APP_PRIVATE_KEY is not a PEM private key" >&2
                  exit 1
                  ;;
              esac
              jq -n --arg key "$APP_PRIVATE_KEY" '{LYDITE_APP_PRIVATE_KEY: $key}'
              ;;
            oauth-exchange)
              if [ -z "$DASHBOARD_CLIENT_SECRET" ]; then
                echo "LYDITE_DASHBOARD_CLIENT_SECRET is not set" >&2
                exit 1
              fi
              jq -n --arg secret "$DASHBOARD_CLIENT_SECRET" \
                '{LYDITE_DASHBOARD_CLIENT_SECRET: $secret}'
              ;;
            *)
              echo "unknown worker: $WORKER" >&2
              exit 1
              ;;
          esac | npx wrangler secret bulk
