# lydite-baseline — this file is yours.
#
# Records this repository's per-component coverage and quality history on the
# `lydite` branch, after a change has merged.
#
# It exists because recording needs `contents: write` and measuring needs to run
# the repository's own test suite, and those two must not be the same job on a
# pull request: a branch can edit its own workflow and its own component
# declaration, so a job that runs a branch's code with a writable token is
# arbitrary write access for anyone who can open a pull request.
# `lydite-pr.yml`'s test job therefore gates read-only and records nothing.
#
# Here the code has already merged. It has passed review, the gate and every
# other stage, so running it with a writable token is the risk any post-merge
# job carries rather than a new one.
#
# `lydite test` writes nothing to the lydite branch at all, so measuring and
# recording are two commands in two jobs, and only the last one holds a token
# that can push. That does not by itself make a pull request's measurement safe
# to record: the measuring job runs the branch's code whatever token it holds,
# so the numbers it emits are the branch's to choose, and `lydite test record`
# verifies no number. What makes this workflow safe is where it runs, not which
# command it uses. See lydite/lydite#49 and docs/adr/0025.
#
# A scan job runs beside the matrix, because a finding count is a scalar the
# history holds and nothing else in this workflow produces one. It is not a
# shard and uploads its reports under its own prefix; `record` downloads both
# and folds them together.
#
# It shards the way `lydite-pr.yml` does — `plan` groups the components,
# a matrix runs them, and one `record` folds every shard's measurements. No
# shard can record: each measured part of the tree, and a partial baseline
# reads as a cache hit on every later change. So the fold is where completeness
# is decided, against the declaration read from the tree being recorded.
#
# Not a gt CI stage, deliberately. The orchestrator skips every stage for a tree
# already validated on the pull request, which is exactly what a squash merge
# produces — so a recording stage would never run.
name: lydite-baseline

on:
  push:
    branches: [main]

# Read by default; only the recording job is granted the write, which is the
# whole of what this workflow exists to hold.
permissions:
  contents: read

# One at a time. Two runs recording different trees is fine — they are different
# keys — but two racing on the same one make the loser retry for nothing, and
# the branch is shared with every other repository job that reads it.
concurrency:
  group: lydite-baseline
  cancel-in-progress: false

jobs:
  # The Go module is rooted at source/cli; the scan root is the repository
  # root, which is where .lydite/ lives. Every step below names the one it
  # needs rather than sharing a job-level working-directory, because a `--dir`
  # written relative to the wrong one is a scan root with no declaration —
  # where `lydite test` reports "no components declared" and this workflow
  # fails without ever reaching the recording it exists for.
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/cli/go.mod
          cache: true
          # Named: the module is at source/cli, and setup-go looks for the
          # dependency file at the workspace root. Without it every restore
          # misses and the job re-downloads the module graph — a slower run and
          # never a red one, which is how it goes unnoticed.
          cache-dependency-path: source/cli/go.sum

      # The tags `.goreleaser.yml` builds a release with. This job records a
      # baseline and never mutates anything, so they change nothing it does —
      # they are here so the binary every lydite workflow runs is one shape.
      - name: build lydite
        working-directory: source/cli
        env:
          LYDITE_BUILD_TAGS: grammar_subset grammar_subset_rust grammar_subset_typescript grammar_subset_tsx
        run: go build -tags "$LYDITE_BUILD_TAGS" -o "${RUNNER_TEMP}/lydite" ./cmd/lydite

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lydite-binary
          path: ${{ runner.temp }}/lydite
          retention-days: 1

  plan:
    name: plan
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/lydite-binary

      - name: lydite test plan
        id: plan
        run: |
          set -euo pipefail
          lydite test plan --dir . --out "${RUNNER_TEMP}/matrix.json"
          # The delimiter form, not `shards=<value>`. The matrix is derived
          # from `.lydite/components.yml`, whose shape this workflow does not
          # control, and the single-line form lets a newline in that value open
          # a second output entry. The delimiter is generated per run so the
          # property is self-contained: a fixed literal would rest on the value
          # never containing that exact line, which is a guarantee held
          # somewhere other than here.
          delim="LYDITE_MATRIX_$(openssl rand -hex 16)"
          {
            echo "shards<<${delim}"
            cat "${RUNNER_TEMP}/matrix.json"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  measure:
    name: measure (${{ matrix.shard.name }})
    needs: [setup, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate resolves a merge-base, and on the default branch that is
          # HEAD itself — which still needs history to resolve at all.
          fetch-depth: 0

      - uses: ./.github/actions/lydite-binary

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lydite
          key: lydite-${{ runner.os }}-${{ hashFiles('.lydite/components.yml', 'source/cli/internal/**/*-pin/**', 'source/cli/internal/semgrep/requirements.txt', 'source/cloud-services/package-lock.json') }}
          restore-keys: lydite-${{ runner.os }}-

      # The same graph the pull-request matrix caches, and for the same reason:
      # without it this job downloads the toolchain go.mod names and compiles
      # every dependency from cold before it measures anything. It is also
      # what fills the entry the pull-request jobs read, since this workflow
      # runs on the default branch, where a cache entry is visible to every
      # branch rather than only to its own.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('source/cli/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # On the default branch HEAD is its own merge-base, so nothing is
      # compared: this measures the tree and leaves what it measured in
      # .lydite-reports/. The next pull request's merge-base is this commit, so
      # it reads the recorded entry instead of measuring the tree again —
      # which is the whole reason this workflow exists.
      #
      # Deliberately not `--affected`: ADR 0016 requires the default-branch run
      # to be complete, since a forgotten depends_on edge is caught at merge or
      # never. `--component` narrows to this shard's slice and nothing else, so
      # the matrix as a whole still runs every declared component.
      - name: lydite test --gate-coverage
        env:
          COMPONENTS: ${{ matrix.shard.components }}
        run: lydite test --dir . --component "$COMPONENTS" --gate-coverage

      - uses: ./.github/actions/lydite-reports
        if: always()
        with:
          name: ${{ matrix.shard.name }}
          prefix: lydite-shard

  # What the repository's standing findings are, so the quality history holds a
  # finding count beside the coverage, CRAP and test counts. `record` reads the
  # scan document out of this job's report directory.
  #
  # It mirrors lydite-pr.yml's scan job with one deliberate difference: no
  # --diff-base. On the default branch there is no change to scope to, so this
  # covers the whole repository, every claim lands unanchorable, and the count
  # is the repository's standing total rather than what one change introduced.
  #
  # And therefore no fetch-depth: 0. A scan resolves a base only when
  # --diff-base is given — since ADR 0032 that resolution happens for the
  # anchor as well as for Semgrep, so a consumer passing --diff-base auto needs
  # the full history whether Semgrep is on or off. This job passes none, so it
  # needs none.
  scan:
    name: scan
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/lydite-binary

      # From the repository root, which is the scan root .lydite/ sits at.
      - name: lydite scan
        run: lydite scan --dir .

      # Under its own prefix, because this is not a shard: `record` downloads
      # the shards by pattern, and an artifact that matched theirs would be
      # folded as a measurement directory it is not.
      - uses: ./.github/actions/lydite-reports
        if: always()
        with:
          name: repository
          prefix: lydite-scan

  record:
    name: record coverage baseline
    needs: [setup, plan, measure, scan]
    # It runs even when a shard failed, and even when the scan went red. A gate
    # that says nothing about coverage — orphans, watch, schedule — would
    # otherwise discard a complete set of measurements, and no later run records
    # this tree, because the next push carries a different one. A red scan on
    # the default branch is the most interesting thing a finding history can
    # hold, for exactly the same reason: the hole it would leave is permanent.
    # `record` refuses a fold that is partial, names another tree, or was never
    # written, so the worst an unconditional run does is say so.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job in either workflow that writes the lydite branch. It runs
    # nothing from the repository — no suite, no setup or teardown command, no
    # compose service — and refuses a document naming a tree other than the one
    # checked out. What makes it safe is that the code has already merged;
    # holding the token in a job that runs none of it is what keeps that true
    # as this workflow grows.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/lydite-binary

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lydite-shard-*
          path: shards

      # Into the same directory, so the fold below hands it to `record` as one
      # more --reports. It holds a scan document and no measurements, which is
      # the shape `record` folds a finding count out of.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lydite-scan-*
          path: shards

      # One write after the fold, never one per shard: N pushes racing one
      # branch, and every shard's document partial by construction, so each
      # would be refused. `record` folds the same directories itself — it runs
      # in a job `merge` does not precede — and asks completeness once, against
      # the declaration read from the tree being recorded.
      - name: lydite test record
        # The branch is stated rather than discovered. Quality history is per
        # branch, and while a push-event checkout does leave a branch checked
        # out, resting a record that nothing can recompute on that behaviour is
        # resting it on a property of an action rather than on what this job
        # knows: it ran because of a push to this ref.
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Found by the documents rather than by the directory layout, because
          # the layout is not ours to predict: actions/download-artifact gives
          # an artifact its own subdirectory only when the pattern matched more
          # than one, and extracts a lone match straight into `path`. There is
          # exactly one scan job, so `lydite-scan-*` always matches once and
          # always lands flat — putting `scan.json` where a `shards/*/` glob
          # never looks and offering that glob the scan's own log directory
          # instead. A fold that globs directories therefore reads a log
          # directory, records no finding count, and stays green saying so.
          #
          # `record` needs the document, so the document is what is looked for.
          # That is right whether an artifact extracted flat or nested, and it
          # does not rest on a behaviour of the action that no test here covers.
          # Depth 2 reaches both shapes and stops above the per-component
          # directories, which hold logs and coverage reports rather than
          # either of these documents.
          args=()
          dirs=()
          while IFS= read -r dir; do
            args+=(--reports "$dir")
            dirs+=("$dir")
          done < <(find shards -maxdepth 2 \
                     \( -name measurements.json -o -name scan.json \) \
                     -exec dirname {} \; | sort -u)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "no shard uploaded a measurements or scan document; there is nothing to record" >&2
            exit 1
          fi
          # Named out loud, because the whole defect this replaces was a fold
          # reading a directory nobody meant it to and saying nothing.
          printf 'folding %s\n' "${dirs[@]}"
          lydite test record --dir . --branch "$BRANCH" "${args[@]}"
