# lydite-baseline — this file is yours.
#
# Records this repository's per-component coverage on the `lydite` branch,
# after a change has merged.
#
# It exists because recording needs `contents: write` and measuring needs to run
# the repository's own test suite, and those two must not be the same job on a
# pull request: a branch can edit its own workflow and its own component
# declaration, so a job that runs a branch's code with a writable token is
# arbitrary write access for anyone who can open a pull request.
# `lydite-pr.yml`'s test job therefore gates read-only and records nothing.
#
# Here the code has already merged. It has passed review, the gate and every
# other stage, so running it with a writable token is the risk any post-merge
# job carries rather than a new one.
#
# `lydite test` writes nothing to the lydite branch at all, so measuring and
# recording are two commands here as well as two jobs. That does not by itself
# make a pull request's measurement safe to record: the measuring job runs the
# branch's code whatever token it holds, so the numbers it emits are the
# branch's to choose, and `lydite test record` verifies no number. What makes
# this workflow safe is where it runs, not which command it uses. See
# lydite/lydite#49 and docs/adr/0025.
#
# Not a gt CI stage, deliberately. The orchestrator skips every stage for a tree
# already validated on the pull request, which is exactly what a squash merge
# produces — so a recording stage would never run.
name: lydite-baseline

on:
  push:
    branches: [main]

permissions:
  contents: write

# One at a time. Two runs recording different trees is fine — they are different
# keys — but two racing on the same one make the loser retry for nothing, and
# the branch is shared with every other repository job that reads it.
concurrency:
  group: lydite-baseline
  cancel-in-progress: false

jobs:
  record:
    name: record coverage baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate resolves a merge-base, and on the default branch that is
          # HEAD itself — which still needs history to resolve at all.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/cli/go.mod
          cache: true

      # The Go module is rooted at source/cli; the scan root is the repository
      # root, which is where .lydite/ lives. Each step names the one it needs
      # rather than sharing a job-level working-directory, because a `--dir`
      # written relative to the wrong one is a scan root with no declaration —
      # where `lydite test` reports "no components declared" and this job fails
      # without ever reaching the recording it exists for.
      - name: build lydite
        working-directory: source/cli
        run: go build -o /tmp/lydite ./cmd/lydite

      # On the default branch HEAD is its own merge-base, so nothing is
      # compared: this measures the tree and leaves the candidate in
      # .lydite-reports/. The next pull request's merge-base is this commit, so
      # it reads the recorded entry instead of measuring the tree again —
      # which is the whole reason this job exists.
      #
      # It is deliberately not `--affected`: a partial run records nothing, so a
      # narrowed run here would leave the entry it exists to write.
      - name: lydite test --gate-coverage
        run: /tmp/lydite test --dir . --gate-coverage

      # The write, and the only step in either workflow that has one. It runs
      # nothing from the repository — no suite, no setup or teardown command,
      # no compose service — and refuses a candidate naming a tree other than
      # the one checked out.
      - name: lydite test record
        run: /tmp/lydite test record --dir . --reports .lydite-reports
