name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-test:
    defaults:
      run:
        working-directory: cli
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod's toolchain line. It was restated in five places, which
          # is how one of them goes stale without anyone noticing.
          go-version-file: cli/go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  goreleaser:
    name: goreleaser
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod's toolchain line. It was restated in five places, which
          # is how one of them goes stale without anyone noticing.
          go-version-file: cli/go.mod
          cache: true

      # goreleaser derives the release body from commit subjects, which can say
      # what landed but not what it means: a change to how a coverage number is
      # computed, or an upgrade step a consumer has to take, has no commit
      # subject that conveys it. docs/release-notes/<tag>.md is where that gets
      # written, and this is what puts it in front of the changelog rather than
      # in a file nobody visits.
      #
      # A missing notes file is not an error. Most releases are patches whose
      # commit list genuinely is the whole story, and failing a release over a
      # file the release did not need would make every release depend on
      # remembering a step.
      #
      # The header is assembled into RUNNER_TEMP, not the working directory.
      # goreleaser's release mode aborts on a dirty worktree, and an untracked
      # release-header.md sitting in the repository root is enough to trip it:
      # "git is in a dirty state ... ?? release-header.md". Snapshot mode
      # disables that validation, so a local `--snapshot` dry-run passes either
      # way and cannot be used to check this.
      - name: Assemble the release header
        env:
          TAG: ${{ github.ref_name }}
          HEADER: ${{ runner.temp }}/release-header.md
        run: |
          set -euo pipefail

          cat docs/release-notes/_header.md > "$HEADER"
          notes="docs/release-notes/${TAG}.md"
          if [[ -f "$notes" ]]; then
            printf '\n---\n\n' >> "$HEADER"
            cat "$notes" >> "$HEADER"
            echo "Release body carries ${notes}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No ${notes}; release body is the header plus the generated changelog." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean --parallelism 1 --release-header=${{ runner.temp }}/release-header.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
