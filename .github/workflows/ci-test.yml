# ci-test — this file is yours.
#
# gt created it once and will never modify or delete it again.
#
# The Go build and the Go suite, plainly.
#
# This is the stage `ci-gate` blocks a merge on, so it holds the checks that
# must be green to merge and nothing that takes longer than they do.
#
# Everything lydite says about a pull request — the referral, the scan, the
# suites through lydite with coverage gated, and the standing comment — is
# `lydite-pr.yml`, as one workflow run. That is the shape a consumer gets from
# `lydite/actions`, and dogfooding a different shape here would leave the
# shipped one unexercised.
name: ci-test

on:
  workflow_call:

permissions:
  # read. This job runs the repository's own test suite, so on a pull request
  # it runs code the pull request wrote. A token that can push to any branch,
  # handed to a job that runs a branch's own code, is arbitrary write access to
  # the repository for anyone who can open a pull request from a branch.
  contents: read

jobs:
  build-test:
    defaults:
      run:
        working-directory: source/cli
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod's toolchain line. It was restated in five places, which
          # is how one of them goes stale without anyone noticing.
          go-version-file: source/cli/go.mod
          cache: true

      - name: go build
        run: go build ./...

      # The plain suite, not lydite's instrumented one. `ci-gate` is the only
      # required check this repository has, so what runs here is what blocks a
      # merge — and it must be the fastest honest form of the suite rather than
      # the gated one.
      #
      # The gated run lives in `lydite-pr.yml`, which owns everything lydite
      # says about a pull request as one workflow because that is the shape a
      # consumer gets. It cannot be a stage here: gt's CI accepts exactly
      # preflight, build, test and end2end, so there is no stage a publish
      # could be. The consequence is that lydite's own coverage gate does not
      # block a merge, which is the state `lydite/referral` is already in and
      # for the same reason — see #34, and #75 for this gap.
      - name: go test
        run: go test -race ./...
