# Write a bumped pin into the places that state it a second time.
#
# Dependabot edits a manifest and nothing else, so a bump to Biome or to one of
# the Go tools lands with internal/pins' mirror still stating the old version.
# `go test` fails it, correctly, and the fix is one command — this runs that
# command on the pull request rather than leaving it to a human.
#
# `pull_request_target`, because a `pull_request` run from Dependabot holds a
# read-only token and no secrets, and this job has to write to the branch. That
# trigger runs the DEFAULT BRANCH's copy of this file with access to secrets,
# so the rule is never the pull request's to edit — the same reason
# lydite-clearance.yml uses it, and the same obligation follows: nothing here
# may check out or execute the pull request's code.
#
# It does not. There is one checkout, of the base, and the branch is reached
# only through the API: the four files pinsync reads are downloaded as data, a
# base-built binary rewrites them, and the changed one is uploaded back. Adding
# `actions/checkout` of the head ref would put a branch's code in a job holding
# a token that can push, which is what lydite's own Semgrep check reports
# (yaml.github-actions.security.pull-request-target-code-checkout).
#
# There is deliberately no `paths:` filter either. One would be a second
# statement of which manifests have mirrors, and internal/pins is already the
# first — a mirror added there would silently never trigger this, which is a
# list that fails open. The job runs on every Dependabot pull request instead
# and finds no drift on the ones touching nothing it knows about.
#
# It pushes as lydite-cicd-bot, an App holding `contents: write` and nothing
# else, and never as the relay's App — that one holds `pull_requests: write`
# and has no endpoint that commits, and widening it would undo the separation
# ADR 0022 exists to keep. This key must likewise never reach the coverage
# gate's job, which does run the repository's code: that is #49 with a nicer
# name.
name: dependabot-pins

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependabot-pins-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor == 'dependabot[bot]'
    name: sync pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A push made with GITHUB_TOKEN starts no workflow run, so the pull
      # request would carry the fix and keep the red checks that fix answers.
      # An App installation token does start one, which is the whole reason
      # this identity exists rather than the one the job already has.
      #
      # With no App configured there is nothing useful to do, and saying what
      # to run beats a green job that changed nothing.
      - name: Check whether the app is configured
        id: configured
        env:
          APP_ID: ${{ secrets.LYDITE_CICD_APP_ID }}
        run: |
          if [ -z "${APP_ID}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::lydite-cicd-bot is not configured, so the mirror was not written. Run 'go run ./tools/pinsync' in source/cli and push."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Narrowed by the App's own installation: this one holds `contents:
      # write` and nothing else, on the repositories it is installed on. The
      # token it mints lives an hour and belongs to no person, which is what
      # separates it from a personal access token carrying somebody's whole
      # account.
      - name: Mint the app's token
        id: token
        if: steps.configured.outputs.present == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.LYDITE_CICD_APP_ID }}
          private-key: ${{ secrets.LYDITE_CICD_PRIVATE_KEY }}

      - name: Check out the base branch
        if: steps.configured.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: steps.configured.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/cli/go.mod
          cache-dependency-path: source/cli/go.sum

      # Downloaded rather than checked out, and read only by the binary built
      # from the base tree. pinsync names the files, so a mirror added to
      # internal/pins needs no edit here.
      - name: Fetch the pull request's pins
        if: steps.configured.outputs.present == 'true'
        working-directory: source/cli
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/head"
          go run ./tools/pinsync -files > "${RUNNER_TEMP}/files.txt"
          while read -r path; do
            mkdir -p "${RUNNER_TEMP}/head/$(dirname "${path}")"
            gh api "repos/${REPO}/contents/source/cli/${path}?ref=${HEAD_SHA}" \
              --jq '.content' | base64 -d > "${RUNNER_TEMP}/head/${path}"
          done < "${RUNNER_TEMP}/files.txt"
          cp -r "${RUNNER_TEMP}/head" "${RUNNER_TEMP}/fetched"

      - name: Write the pins
        if: steps.configured.outputs.present == 'true'
        working-directory: source/cli
        run: go run ./tools/pinsync -root "${RUNNER_TEMP}/head"

      # One file in practice: a bump touches one manifest, and each manifest
      # has one mirror. The loop is what makes that a property of
      # internal/pins rather than of this file.
      - name: Upload what changed
        if: steps.configured.outputs.present == 'true'
        working-directory: source/cli
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          while read -r path; do
            if cmp -s "${RUNNER_TEMP}/fetched/${path}" "${RUNNER_TEMP}/head/${path}"; then
              continue
            fi
            sha=$(gh api "repos/${REPO}/contents/source/cli/${path}?ref=${BRANCH}" --jq '.sha')
            gh api -X PUT "repos/${REPO}/contents/source/cli/${path}" \
              -f message="build(deps): write the bumped pin into its mirror" \
              -f content="$(base64 -w0 "${RUNNER_TEMP}/head/${path}")" \
              -f sha="${sha}" \
              -f branch="${BRANCH}" --jq '.commit.sha'
          done < "${RUNNER_TEMP}/files.txt"
