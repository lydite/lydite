# Everything lydite says about a pull request, as one workflow run.
#
# This is the shape a consumer gets, dogfooded here: `lydite/actions` packages
# the same four steps as a reusable workflow, and this file is what that
# workflow has to be able to express. Running it from source rather than from a
# release is the point — a dogfood against the last release tests the last
# release.
#
#   referral ──────────────────────┐   no needs, so the status lands in seconds
#   scan ──────────────────────────┤   each job uploads its .lydite-reports/
#   plan ─┬─► test (matrix) ───────► merge
#         └─► mutation (matrix) ───► mutation-merge
#                                  └─► publish   needs all, if: always()
#
# `plan` groups the declared components into shards — the sets that must run in
# one process, because they publish a host port in common or are rooted at
# overlapping directories — and each fold turns the shards' documents back into
# one section. A shard reports exactly the components it was given, so every
# declared component takes exactly one row across the matrix and the fold fails
# over a shard whose job died.
#
# The mutation matrix runs *beside* the test matrix and reuses `plan`'s output
# verbatim: a shard is the conflict closure over published host ports and
# overlapping directories, which is the same question whichever command
# consumes it. It does not run after: mutation and the coverage gate share a
# checkout and not a compilation — the gate builds the instrumented variant
# once and mutation builds the plain variant once per mutant — so a phase
# inside `test` would make each of those jobs serially longer by the most
# expensive thing lydite runs. The cost is one duplicated instrumented run per
# component, which on a matrix is wall-clock free and machine time once.
#
# One run, so every report is an artifact of it. That is the whole reason the
# four are here together: the comment is assembled from all of them, and a
# publish triggered by a different workflow's completion could not see the
# referral's report without either recomputing the verdict or looking a run up
# by head SHA and racing it.
#
# Deliberately outside the gt pipeline, and it cannot be inside it: gt's CI
# accepts exactly the stages preflight, build, test and end2end, so there is no
# stage a publish could be, and `statuses: write` is not something a called
# stage can be granted. `ci-test.yml` therefore keeps the plain `go build` and
# `go test -race` that ci-gate blocks on, and the gated, instrumented run lives
# here. lydite's own coverage gate consequently does not block a merge — the
# state `lydite/referral` is already in, for the same reason (#34). What that
# trade costs, and what closes it, is #75.
name: lydite

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One verdict per revision. A superseded push is about to be re-decided, and
# two runs racing to write the same status and the same comment would leave
# whichever finished last standing rather than whichever is current.
concurrency:
  group: lydite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Built once. Four jobs each compiling the same binary is three minutes of
  # runner time spent proving the compiler is deterministic.
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod's toolchain line. It was restated in five places, which
          # is how one of them goes stale without anyone noticing.
          go-version-file: source/cli/go.mod
          cache: true
          # Named: the module is at source/cli, and setup-go looks for the
          # dependency file at the workspace root. Without it every restore
          # misses and the job re-downloads the module graph — a slower run and
          # never a red one, which is how it goes unnoticed.
          cache-dependency-path: source/cli/go.sum

      # The same tags `.goreleaser.yml` builds a release with, so the dogfood
      # runs the binary a consumer gets rather than a fatter one that happens
      # to behave the same.
      - name: build lydite
        working-directory: source/cli
        env:
          LYDITE_BUILD_TAGS: grammar_subset grammar_subset_rust grammar_subset_typescript grammar_subset_tsx
        run: go build -tags "$LYDITE_BUILD_TAGS" -o "${RUNNER_TEMP}/lydite" ./cmd/lydite

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lydite-binary
          path: ${{ runner.temp }}/lydite
          retention-days: 1

  referral:
    name: referral
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The verdict is the record a clearance acts on, and this job publishing
      # it without waiting on scan or test is what lets a person start clearing
      # a referral while the matrix is still running (ADR 0015).
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The referral is computed from <merge-base>..HEAD, so the history
          # reaching that merge-base has to be present. A shallow checkout
          # resolves no merge-base and the run fails rather than deciding from
          # a diff that describes something else.
          fetch-depth: 0

      - uses: ./.github/actions/lydite-binary

      # Runs from the repository root: --dir locates the exemptions file, and
      # the diff a referral reads covers the whole repository regardless.
      #
      # `review` exits 2 on a referral and 1 on the isolation gate, and both
      # are answers rather than malfunctions — the verdict is carried by the
      # status this step just published and by the report it wrote, so the step
      # must not fail the job over one. Anything above 2 is lydite failing to
      # reach an answer, which must still fail the job.
      #
      # The exit code is captured with `|| verdict=$?` rather than read from
      # `$?` on the next line, because the runner invokes this with `bash -e`:
      # a bare command exiting non-zero ends the step before any line after it
      # runs, and `set +e` here would also disarm the failure this step does
      # want to report.
      - name: publish the referral verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          verdict=0
          lydite review --dir . --publish || verdict=$?
          if [ "$verdict" -gt 2 ]; then
            exit "$verdict"
          fi

      - uses: ./.github/actions/lydite-reports
        if: always()
        with:
          name: referral

  scan:
    name: scan
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --diff-base auto resolves the merge-base, which scopes Semgrep's
          # token-less fallback to what this change introduces rather than to
          # the repository's pre-existing findings.
          fetch-depth: 0

      - uses: ./.github/actions/lydite-binary

      # From the repository root, which is the scan root .lydite/ sits at. This
      # is lydite scanning itself, and it is the only job that exercises the
      # scan path end to end against a real repository.
      - name: lydite scan
        run: lydite scan --dir . --diff-base auto

      - uses: ./.github/actions/lydite-reports
        if: always()
        with:
          name: scan

  # Pure: it reads .lydite/components.yml and each component's compose file,
  # and nothing else. No git, no network, no process — which is why it needs no
  # history, and why it cannot narrow by --affected. The shards narrow instead.
  plan:
    name: plan
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/lydite-binary

      - name: lydite test plan
        id: plan
        run: |
          set -euo pipefail
          lydite test plan --dir . --out "${RUNNER_TEMP}/matrix.json"
          # The delimiter form, not `shards=<value>`. The matrix is derived
          # from `.lydite/components.yml`, which the pull request under test
          # owns, and the single-line form lets a newline in that value open a
          # second output entry. The delimiter is generated per run so the
          # property is self-contained: a fixed literal would rest on the value
          # never containing that exact line, which is a guarantee held
          # somewhere other than here.
          delim="LYDITE_MATRIX_$(openssl rand -hex 16)"
          {
            echo "shards<<${delim}"
            cat "${RUNNER_TEMP}/matrix.json"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.shard.name }})
    needs: [setup, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every failing shard, in one run. A cancelled sibling leaves its
      # components with no row at all, which `lydite test merge` reports as a
      # shard that died rather than as the failure that actually happened.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # Read-only, deliberately. This job runs the repository's own suites and
    # any `setup`/`teardown` shell the declaration carries, which on a pull
    # request is the pull request's own code. Nothing it runs holds a token
    # that can write anywhere — and nothing it runs would use one: `lydite
    # test` writes nothing to the lydite branch, leaving its measurement as a
    # candidate in .lydite-reports/ for `lydite test record` to land.
    #
    # Nothing lands it here. `lydite-baseline.yml` records after a change has
    # merged, where the code has already passed review and every gate, so the
    # baseline this job reads is one lydite measured on a tree nobody was
    # proposing at the time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate resolves the merge-base with the base branch, and a
          # shallow checkout cannot reach it. lydite refuses rather than
          # quietly widening or narrowing, so without this the run fails with
          # exactly the message a consumer would get.
          fetch-depth: 0

      - uses: ./.github/actions/lydite-binary

      # Everything lydite installs for a component — the pinned cargo tools,
      # Biome, a language toolchain it had to fetch — lands here, keyed by
      # version. The key names the pin manifests so a Dependabot bump misses
      # and installs what it just pinned.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lydite
          key: lydite-${{ runner.os }}-${{ hashFiles('.lydite/components.yml', 'source/cli/internal/**/*-pin/**', 'source/cli/internal/semgrep/requirements.txt', 'source/cloud-services/package-lock.json') }}
          restore-keys: lydite-${{ runner.os }}-

      # The Go toolchain, the modules and the compiled dependencies every
      # component's suite is built from. Without it each job downloads the
      # toolchain its go.mod names and compiles gotreesitter and the rest of
      # the graph from cold, every run — and mutation pays that before its
      # first mutant, which is the one job whose budget is the sum of a suite
      # run repeated a hundred times.
      #
      # Keyed on go.sum, so the entry is written once per dependency change
      # and read thereafter. Not on the commit: a per-commit key writes a new
      # multi-gigabyte entry on every push and evicts the rest of the
      # repository's cache to hold copies of one graph.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('source/cli/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # No working-directory override, and that is deliberate. A step-level
      # relative working-directory is resolved against the workspace rather
      # than against the job's default, so `..` would name a directory above
      # the checkout — one with no declaration and no work tree, where
      # `lydite test` reports "no components declared" and exits 0. The suites
      # and the gate would both stop running while this job stayed green,
      # which is the failure the whole gate exists to prevent, in the workflow
      # that runs it. The scan root is named by the flag instead, which lydite
      # resolves against its own directory and needs no runner semantics to be
      # right.
      # --affected on a pull request, exactly as `lydite/actions` passes it:
      # a change runs the components it could have broken, and every other
      # component's baseline entry carries forward so the candidate still
      # covers the whole declaration. It is what makes the recorded baseline
      # worth having — without it every pull request runs every component and
      # the cache saves only the base-tree measurement.
      #
      # Never on a push, where it would buy nothing: on the default branch
      # the merge-base is HEAD itself, so `--affected` selects every component
      # anyway and the flag only obscures the intent.
      # --component says what this job is responsible for, and --affected which
      # of those need running. The two compose: this shard reports one row per
      # component in its slice whether or not selection ran it, and nothing at
      # all about any other — which is what lets the fold below decide
      # completeness from the declaration and the documents alone.
      - name: lydite test
        env:
          COMPONENTS: ${{ matrix.shard.components }}
        run: lydite test --dir . --affected --component "$COMPONENTS" --gate-coverage

      # Under its own prefix, so `publish` never reads a shard's document as a
      # `test` section of its own: there would be one per shard, each answering
      # about part of the repository under one heading.
      - uses: ./.github/actions/lydite-reports
        if: always()
        with:
          name: ${{ matrix.shard.name }}
          prefix: lydite-shard

  mutation:
    name: mutation (${{ matrix.shard.name }})
    needs: [setup, plan]
    runs-on: ubuntu-latest
    # Longer than the test matrix on purpose: a mutant is a suite run, and a
    # component's budget is its mutant count times its own suite. Nothing caps
    # that inside lydite — every way of exceeding an invented budget is bad —
    # so a run genuinely too large dies here, the shard uploads no document,
    # and the fold below reports it as a shard that died. Loud, and by
    # machinery that exists.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # Read-only, exactly as the test matrix is, and for the same reason: this
    # job runs the pull request's own suites, once per mutant, plus any
    # `setup`/`teardown` shell the declaration carries. Mutation writes nothing
    # to the lydite branch — it has no baseline to record — so there is nothing
    # here that would use a token that can write.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Mutation is diff-scoped always: mutants come from the change
          # against the merge-base, and a shallow checkout resolves no
          # merge-base. lydite refuses rather than mutating the repository.
          fetch-depth: 0

      - uses: ./.github/actions/lydite-binary

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lydite
          key: lydite-${{ runner.os }}-${{ hashFiles('.lydite/components.yml', 'source/cli/internal/**/*-pin/**', 'source/cli/internal/semgrep/requirements.txt', 'source/cloud-services/package-lock.json') }}
          restore-keys: lydite-${{ runner.os }}-

      # The Go toolchain, the modules and the compiled dependencies every
      # component's suite is built from. Without it each job downloads the
      # toolchain its go.mod names and compiles gotreesitter and the rest of
      # the graph from cold, every run — and mutation pays that before its
      # first mutant, which is the one job whose budget is the sum of a suite
      # run repeated a hundred times.
      #
      # Keyed on go.sum, so the entry is written once per dependency change
      # and read thereafter. Not on the commit: a per-commit key writes a new
      # multi-gigabyte entry on every push and evicts the rest of the
      # repository's cache to hold copies of one graph.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('source/cli/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # --affected and --component compose here as they do in the test matrix:
      # this shard reports one row per component in its slice whether or not
      # selection ran it, and nothing at all about any other. A component the
      # change does not touch costs nothing — no baseline suite, no compose
      # stack — because half of what bounds a mutant is knowable from the diff
      # alone.
      # --stream, and only here. A mutation run prints nothing for as long as
      # it takes: every mutant's line goes to the component's log, and that log
      # reaches a reader through an artifact this job uploads on its way out.
      # A job that is killed never gets there, so the whole run is lost and
      # nothing says how far it had come — which is the case --stream exists
      # for. The test matrix keeps its output captured: a suite's log is
      # thousands of passing lines, and a CI log carrying all of them buries
      # the one component that failed.
      #
      # --concurrency 2, because a slot costs more here than it does in the
      # test matrix and the default is set for that one. A slot in `lydite
      # test` is an already-compiled suite; a slot in `lydite mutation` is a
      # *compile* as well, since an overlay changes the build hash — and this
      # repository's `cli` component declares `-race` over a package graph
      # carrying all 206 of gotreesitter's grammars, which is the heaviest
      # build it has. Four of those at once exhausts a 16GB runner: the agent
      # is killed, the step reports 143, and every `if: always()` step and
      # post-step after it is skipped, which is the signature of a runner
      # that went away rather than a job that failed.
      - name: lydite mutation
        env:
          COMPONENTS: ${{ matrix.shard.components }}
        run: |
          # Temporary: the mutation job dies with its runner at roughly the
          # same mutant each run, and neither memory nor disk has been measured
          # on the runner itself. Sampled to stderr beside the mutant stream so
          # the two line up. Remove once the cause is named.
          ( while :; do
              printf 'probe %s mem_avail_MB=%s gocache_MB=%s root_avail_MB=%s\n' \
                "$(date -u +%T)" \
                "$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)" \
                "$(du -sm "${HOME}/.cache/go-build" 2>/dev/null | cut -f1)" \
                "$(df -m --output=avail / | tail -1)" >&2
              sleep 20
            done ) &
          probe=$!
          trap 'kill "${probe}" 2>/dev/null || true' EXIT
          lydite mutation --dir . --affected --component "$COMPONENTS" --stream --concurrency 2

      # Under its own prefix, so `publish` never reads a shard's document as a
      # `mutation` section of its own: there would be one per shard, each
      # answering about part of the repository under one heading.
      - uses: ./.github/actions/lydite-reports
        if: always()
        with:
          name: ${{ matrix.shard.name }}
          prefix: lydite-mutation-shard

  # The completeness check, and nothing else: a declared component with no row
  # in any shard is a shard whose job died, which an `unmeasured` row would let
  # publish as a passing verdict over a repository half of which was never
  # mutated. The same implementation `merge` uses, with a summary row instead
  # of the figures over the repository — there is no repository-wide mutation
  # figure, since survived == 0 for every component is survived == 0 for the
  # repository.
  mutation-merge:
    name: mutation merge
    needs: [setup, plan, mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/lydite-binary

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lydite-mutation-shard-*
          path: mutation-shards

      # The component subdirectories are copied in first, as the test fold does
      # and for the same reason: the folded rows carry the shards' own `log`
      # paths, and `publish` resolves those against the directory it is given.
      - name: lydite mutation merge
        run: |
          shopt -s nullglob
          args=()
          for dir in mutation-shards/*/; do
            args+=(--reports "${dir%/}")
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no shard uploaded a report directory; there is nothing to fold" >&2
            exit 1
          fi
          mkdir -p .lydite-reports
          for logs in mutation-shards/*/*/; do
            cp -R "$logs" .lydite-reports/
          done
          status=0
          lydite mutation merge --dir . "${args[@]}" || status=$?
          echo "lydite mutation merge exited $status"
          exit "$status"

      - uses: ./.github/actions/lydite-reports
        if: always()
        with:
          name: mutation

  # The only thing that computes coverage(repo) and patch(repo): both sum every
  # component's counts, so a shard holding two of four would answer about its
  # own two under a label about the repository.
  #
  # It touches no network and runs nothing from the repository. The shards'
  # measurements carry each component's counts, its patch part and the baseline
  # entry it was gated against, so the composition needs neither the lydite
  # branch nor a merge-base.
  merge:
    name: merge
    needs: [setup, plan, test]
    # Whatever the shards did. A shard that failed is exactly the run whose
    # fold a reader wants, and a shard that died is what the fold exists to
    # report rather than to inherit as silence.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/lydite-binary

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lydite-shard-*
          path: shards

      # A directory per shard. `merge` fails when a declared component has no
      # row in any of them, so a matrix job that never uploaded is reported
      # rather than folded into silence — an unmeasured row does not vote, and
      # would publish a passing verdict over a repository half of which was
      # never tested. That verdict is this job's, so the exit code is re-raised
      # rather than only reported; the upload below runs on `if: always()`.
      #
      # Each shard's component subdirectories are copied in first. The folded
      # rows carry the shards' own `log` paths, and `publish` resolves those
      # against the directory it is given — this one. Without the copy a red
      # component's row in the comment names a log that is in an artifact
      # `publish` deliberately never downloads, and carries no tail at all.
      - name: lydite test merge
        run: |
          shopt -s nullglob
          args=()
          for dir in shards/*/; do
            args+=(--reports "${dir%/}")
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no shard uploaded a report directory; there is nothing to fold" >&2
            exit 1
          fi
          mkdir -p .lydite-reports
          for logs in shards/*/*/; do
            cp -R "$logs" .lydite-reports/
          done
          status=0
          lydite test merge --dir . "${args[@]}" || status=$?
          echo "lydite test merge exited $status"
          exit "$status"

      - uses: ./.github/actions/lydite-reports
        if: always()
        with:
          name: test

  publish:
    name: publish
    needs: [setup, referral, scan, merge, mutation-merge]
    # Runs whatever the others did. A comment that only appears when everything
    # passed is a comment nobody needs: the run that failed is the one whose
    # reader wants to know why.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Mints the Actions OIDC token the relay authenticates. It is not a
      # credential and grants nothing by itself — the relay decides what may be
      # written from the claims GitHub signed into it.
      id-token: write
      # The fallback path only, for a repository the app is not installed on.
      # It is a required path rather than a stopgap: a consumer who has
      # installed nothing still gets a comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/lydite-binary

      # Every job's directory, each under its own name. `publish` takes as many
      # as it is given and names any it could not read, so a job that died
      # before uploading renders as a section saying so rather than vanishing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lydite-reports-*
          path: reports

      - name: render the comment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          shopt -s nullglob
          args=()
          for dir in reports/*/; do
            args+=(--reports "${dir%/}")
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no report directories were uploaded; there is nothing to publish" >&2
            exit 1
          fi
          lydite publish "${args[@]}" --base "$BASE_SHA" --out comment.md
          echo "::group::the comment"
          cat comment.md
          echo "::endgroup::"

      - uses: ./.github/actions/lydite-comment
        with:
          body-file: comment.md
          pull-request: ${{ github.event.pull_request.number }}
