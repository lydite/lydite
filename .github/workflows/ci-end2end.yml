# ci-end2end — this file is yours.
#
# gt created it once and will never modify or delete it again.
#
# Dogfooding, moved from ci.yml verbatim. It belongs in end2end rather than
# build because it is exactly that: the scanner built from this tree, run
# against a real repository, exercising the scan and report path end to end.
#
# Distinct from the `lydite` stage in ci-orchestration, which runs the last
# RELEASED scanner. This one asks "does the scanner in this PR still work";
# that one asks "does the shipped scanner still pass this repo". Both matter,
# and neither substitutes for the other.
name: ci-end2end

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # lydite's own repository cannot exercise the cargo runners. `source/web/` is
  # empty and the only Cargo.toml files are pin manifests, which are
  # deliberately not components — so without a foreign repository they would
  # merge with their argv asserted and never once executed, which is a check
  # reporting a pass having never run. `source/cloud-services` closes that for
  # vitest and leaves cargo open.
  #
  # proving-ground is that repository. It is checked out rather than vendored
  # because lydite has to run against it as a foreign repo: a fixture inside
  # this tree would be scanned as part of lydite.
  proving-ground:
    name: proving ground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lydite/proving-ground
          path: proving-ground
          # --affected resolves a merge-base against origin/main, which a
          # shallow checkout cannot reach. lydite refuses rather than quietly
          # widening or narrowing, so without this the selection step below
          # fails with exactly the message a consumer would get.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/cli/go.mod
          cache: true

      # lydite installs the pinned cargo-nextest itself, and building it from
      # source is ~7 minutes. Cached, that is a one-time cost per pin bump
      # rather than a cost per run — which is the same thing consumers are told
      # to cache, so this job runs the arrangement it recommends. Keyed on the
      # pin manifests, so a Dependabot bump misses the cache and installs the
      # version it just pinned rather than reusing the one it replaced.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lydite
          key: lydite-tools-${{ runner.os }}-${{ hashFiles('source/cli/internal/**/Cargo.toml', 'source/cli/internal/**/go.mod', 'source/cli/internal/**/requirements.txt') }}
          restore-keys: lydite-tools-${{ runner.os }}-

      - name: build lydite
        working-directory: source/cli
        run: go build -o /tmp/lydite ./cmd/lydite

      # Nothing prepares the tree first, and that is the point. lydite installs
      # a JavaScript component's dependencies itself and starts each
      # component's compose services itself, so a step here doing either would
      # hide the case a consumer actually hits. Two of the four components
      # bring up postgres and wait for it to report healthy; ubuntu-latest
      # carries the docker compose plugin the probe finds.
      #
      # The expected verdict is not all-green. `scripts/seed.ts` is under no
      # component and carries no exclude on purpose, so the orphan gate has to
      # fail on it — which is why this asserts the verdict rather than checking
      # for the absence of one. A job that only checked `exit 0` would go green
      # the day the gate stopped working, and that is the failure a proving
      # ground exists to catch. The script also holds every component to a
      # pass, so the expected failure cannot mask a runner that broke.
      - name: lydite test (proving ground)
        run: |
          status=0
          /tmp/lydite test --dir proving-ground --json > report.json || status=$?
          echo "lydite test exited $status"
          cat report.json
          python3 .github/assert-proving-ground.py report.json proving-ground

      # The only place component-driven scanning of Rust executes at all.
      # lydite's own repository declares no Rust component — its only
      # Cargo.toml files are pin manifests, which the declaration excludes —
      # so the self-scan in `lydite-pr.yml` reaches the Go and TypeScript
      # paths and nothing else.
      #
      # The verdict is deliberately not asserted, unlike the test step. The
      # proving ground carries real findings on purpose (unlicensed crates, a
      # WriteFile at 0644), so demanding green would have somebody tidy away
      # the evidence that a scanner works. What is asserted is that every
      # declared component was scanned by the checks its language implies — a
      # run that scanned nothing exits 0 too — and that no member crate or
      # workspace package appears as a unit of its own, which is what a
      # regression back to walking for manifests would look like.
      - name: lydite scan (proving ground)
        run: |
          status=0
          /tmp/lydite scan --dir proving-ground --json > scan.json || status=$?
          echo "lydite scan exited $status"
          cat scan.json
          # An error rather than a verdict writes no document at all, and the
          # assertion would then die parsing an empty file instead of showing
          # what lydite said. The message is on stderr, already in this log.
          if [ ! -s scan.json ]; then
            echo "lydite scan produced no report; see its error above" >&2
            exit 1
          fi
          python3 .github/assert-proving-ground.py --scan scan.json

      # Selection has to be shown to have selected. A run that narrowed
      # wrongly and a run that narrowed correctly are both green and both
      # faster, so the assertion names the components that must NOT have run
      # as well as the ones that must — a selection returning everything
      # satisfies every claim about correctness and delivers none of the value.
      #
      # The probe touches go/api/, which reaches sdk and web only through the
      # declared dependency edge: their clients are generated from the spec api
      # emits, across three languages, and no build tool derives that. This is
      # the case lydite's own unit tests cannot establish, because they supply
      # the declaration they then assert against.
      #
      # It costs one extra run of three of the four components. The fourth
      # case — a lockfile selecting everything — is deliberately not run here:
      # it is exactly the full run the step above already performs, so paying
      # for it twice would buy an assertion the unit tests already hold.
      - name: lydite test --affected (proving ground)
        run: |
          git -C proving-ground config user.email ci@lydite.invalid
          git -C proving-ground config user.name "lydite ci"
          git -C proving-ground switch --quiet -c selection-probe
          # The package name is read from a file already there rather than
          # written down here. Nothing in this repository pins what
          # lydite/proving-ground calls that package, so a hardcoded one is a
          # cross-repo coupling that turns a rename over there into a
          # compilation failure here — reported against lydite, in a step
          # about selection.
          pkg=$(awk '/^package /{print $2; exit}' proving-ground/go/api/api.go)
          if [ -z "$pkg" ]; then
            echo "could not read the package name from proving-ground/go/api/api.go" >&2
            exit 1
          fi
          printf 'package %s\n\n// The selection probe makes a diff under this component, so CI can\n// assert which components a change here selects.\n' "$pkg" \
            > proving-ground/go/api/selection_probe.go
          # The probe file alone, never `add -A`. This step runs in the same
          # checkout as the full run above, so a stray artefact swept into the
          # commit would widen selection — .lydite-reports/** matches no
          # component and a touched lockfile is an invalidator — and the
          # assertion would fail on the harness rather than on lydite. The
          # proving ground gitignores its report directory today, but that is
          # another repository's file to change.
          git -C proving-ground add go/api/selection_probe.go
          git -C proving-ground commit --quiet -m "selection probe"
          status=0
          /tmp/lydite test --dir proving-ground --affected --json > affected.json || status=$?
          echo "lydite test --affected exited $status"
          cat affected.json
          python3 .github/assert-proving-ground.py --affected affected.json proving-ground

      # Each component's whole output, for when the tail under its row is not
      # enough. lydite captures rather than streams, so this is the only copy —
      # which is the trade: a passing run's log stays out of the job log
      # entirely, and a failing one is a download away rather than buried in
      # someone else's container lifecycle.
      - name: collect component logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proving-ground-component-logs
          path: proving-ground/.lydite-reports/
          if-no-files-found: ignore

  # The coverage gate, end to end, against a real repository: a baseline miss
  # measured in a worktree, a recording, a cache hit, a sharded run and the
  # fold. This is lydite/lydite#48.
  #
  # It replaces the `lydite test record` step that used to sit in the job above:
  # steps 4 and 5 here are a strict superset of it, and paying for a gated run
  # twice is a full extra pass over four components. What that step guarded —
  # that `lydite-baseline.yml`, the only writer of the baseline, actually
  # writes one — is guarded here and more thoroughly, because that workflow
  # runs only on pushes to the default branch and its failure mode is a slow
  # job rather than a red one.
  #
  # Its own runner and its own local bare origin, so the recording is exercised
  # for real and pushes nowhere.
  proving-ground-coverage:
    name: proving ground — coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lydite/proving-ground
          path: proving-ground
          # Every gate here resolves a merge-base, which a shallow checkout
          # cannot reach.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/cli/go.mod
          cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lydite
          key: lydite-tools-${{ runner.os }}-${{ hashFiles('source/cli/internal/**/Cargo.toml', 'source/cli/internal/**/go.mod', 'source/cli/internal/**/requirements.txt') }}
          restore-keys: lydite-tools-${{ runner.os }}-

      - name: build lydite
        working-directory: source/cli
        run: go build -o /tmp/lydite ./cmd/lydite

      # 1. The planner, which runs no suite and needs no git at all. `api` and
      # `tally` publish host port 5432 under services deliberately named `db`
      # and `postgres`, so they have to land in one shard: apart, they are safe
      # only on a runner topology that gives every matrix job its own machine.
      - name: lydite test plan (proving ground)
        run: |
          set -euo pipefail
          /tmp/lydite test plan --dir proving-ground --out matrix.json
          cat matrix.json
          python3 .github/assert-proving-ground.py --plan matrix.json

      # 2. A local bare origin, the base commit B as `main`, and a probe branch
      # P adding an untested exported function under go/api/. Nothing leaves
      # this runner.
      #
      # The package name is read from a file already there rather than written
      # down here: nothing in this repository pins what lydite/proving-ground
      # calls that package, and a hardcoded one turns a rename over there into
      # a failure reported against lydite.
      - name: base and probe
        run: |
          set -euo pipefail
          git init --bare --quiet --initial-branch=main "$RUNNER_TEMP/coverage-origin.git"
          git -C proving-ground config user.email ci@lydite.invalid
          git -C proving-ground config user.name "lydite ci"
          git -C proving-ground remote set-url origin "$RUNNER_TEMP/coverage-origin.git"
          git -C proving-ground push --quiet origin HEAD:refs/heads/main
          git -C proving-ground rev-parse HEAD > "$RUNNER_TEMP/base-commit"
          git -C proving-ground switch --quiet -c coverage-probe
          pkg=$(awk '/^package /{print $2; exit}' proving-ground/go/api/api.go)
          if [ -z "$pkg" ]; then
            echo "could not read the package name from proving-ground/go/api/api.go" >&2
            exit 1
          fi
          printf 'package %s\n\n// CoverageProbe is exported, untested, and here so the gate has\n// something to fail on.\nfunc CoverageProbe(n int) int {\n\tif n > 0 {\n\t\treturn n\n\t}\n\treturn -n\n}\n' "$pkg" \
            > proving-ground/go/api/coverage_probe.go
          # The probe file alone, never `add -A`: a stray artefact swept into
          # the commit would widen selection, and the assertions would then
          # fail on the harness rather than on lydite.
          git -C proving-ground add go/api/coverage_probe.go
          git -C proving-ground commit --quiet -m "coverage probe"

      # 3. Nothing has been recorded yet, so this is a cache miss: the base
      # tree is checked out into a throwaway worktree and measured through the
      # same path this run just took. The assertion is the negative as much as
      # the positive — a gate that compared nothing is green too, so what is
      # checked is that the component the probe changed FAILED and the one it
      # could not have touched carried its baseline forward.
      - name: baseline miss (proving ground)
        run: |
          status=0
          /tmp/lydite test --dir proving-ground --affected --gate-coverage --json > miss.json || status=$?
          echo "lydite test --gate-coverage exited $status"
          cat miss.json
          python3 .github/assert-proving-ground.py --miss miss.json

      # 4. The measure/record split, on the base tree. `lydite test` writes
      # nothing to the lydite branch; `lydite test record` lands it, executing
      # no suite, no setup or teardown command and no compose service.
      #
      # The recording runs even when the measuring step failed: the proving
      # ground fails its orphan gate on purpose, and a gate saying nothing
      # about coverage must not discard a complete set of measurements.
      - name: record the base tree (proving ground)
        run: |
          set -uo pipefail
          git -C proving-ground switch --quiet --detach "$(cat "$RUNNER_TEMP/base-commit")"
          status=0
          /tmp/lydite test --dir proving-ground --gate-coverage --json > gated.json || status=$?
          echo "lydite test --gate-coverage exited $status"
          recorded=0
          /tmp/lydite test record --dir proving-ground \
            --reports proving-ground/.lydite-reports --json > recorded.json || recorded=$?
          echo "lydite test record exited $recorded"
          cat recorded.json
          python3 .github/assert-proving-ground.py --record gated.json recorded.json || exit 1
          # The branch itself, not only the row that claims to have written it.
          # A partial entry reads as a cache hit on every later change, so what
          # is asserted is one entry per declared component and nothing else.
          tree=$(git -C proving-ground rev-parse 'HEAD^{tree}')
          git -C proving-ground fetch --quiet origin lydite
          git -C proving-ground show "origin/lydite:v4/${tree}.json" > entries.json
          cat entries.json
          python3 .github/assert-proving-ground.py --entries entries.json

      # 5. The shards, run sequentially in this one job rather than on three
      # runners: what is being asserted is what each shard reports, and a matrix
      # would buy nothing but three more checkouts. Each takes the slice the
      # planner gave it, and each must now HIT the baseline recorded above —
      # a run that measured the base tree again is green and slow, which is
      # exactly how this class of failure goes unnoticed.
      - name: the shards (proving ground)
        run: |
          set -uo pipefail
          git -C proving-ground switch --quiet coverage-probe
          shards=$(python3 -c 'import json,sys; print(" ".join(e["name"]+":"+e["components"] for e in json.load(open("matrix.json"))))')
          reports=()
          for shard in $shards; do
            name=${shard%%:*}
            components=${shard#*:}
            status=0
            /tmp/lydite test --dir proving-ground --affected --component "$components" \
              --gate-coverage --json > "shard-$name.json" || status=$?
            echo "shard $name exited $status"
            cat "shard-$name.json"
            rm -rf "reports-$name"
            cp -R proving-ground/.lydite-reports "reports-$name"
            reports+=("reports-$name")
          done
          printf '%s\n' "${reports[@]}" > "$RUNNER_TEMP/shard-dirs"
          python3 .github/assert-proving-ground.py --hit shard-*.json

      # 6. The fold. Every declared component takes exactly one row, the
      # whole-tree gates collapse to one each, and the two figures no shard can
      # produce — coverage(repo) and patch(repo) — are computed here and
      # nowhere else.
      - name: lydite test merge (proving ground)
        run: |
          set -uo pipefail
          args=()
          while read -r dir; do args+=(--reports "$dir"); done < "$RUNNER_TEMP/shard-dirs"
          status=0
          /tmp/lydite test merge --dir proving-ground "${args[@]}" --json > merged.json || status=$?
          echo "lydite test merge exited $status"
          cat merged.json
          python3 .github/assert-proving-ground.py --merged merged.json

      # 7. The same fold with one shard's directory omitted. This is how a dead
      # runner is exercised without one dying: an `unmeasured` row does not
      # vote, so a fold that reported one would publish `"verdict": "pass"`
      # over a repository half of which was never tested.
      - name: a shard that never reported (proving ground)
        run: |
          set -uo pipefail
          args=()
          while read -r dir; do
            case "$dir" in
              *web) continue ;;
            esac
            args+=(--reports "$dir")
          done < "$RUNNER_TEMP/shard-dirs"
          status=0
          /tmp/lydite test merge --dir proving-ground "${args[@]}" --json > incomplete.json || status=$?
          echo "lydite test merge exited $status"
          if [ "$status" -eq 0 ]; then
            echo "a fold missing a shard exited 0" >&2
            exit 1
          fi
          cat incomplete.json
          python3 .github/assert-proving-ground.py --incomplete incomplete.json web

      - name: collect component logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proving-ground-coverage-logs
          path: |
            proving-ground/.lydite-reports/
            reports-*/
          if-no-files-found: ignore

  # The single job the branch-protection ruleset actually requires. Individual
  # job names (lint, build & test, ...) are an implementation detail that
  # changes as CI evolves — pointing the ruleset at each one means every job
  # rename/add/remove is also a ruleset edit, and a job nothing requires goes
  # unnoticed. Add a job to `needs:` below and the gate covers it
  # automatically; the ruleset itself never needs to change again.
