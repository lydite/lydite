# ci-end2end — this file is yours.
#
# gt created it once and will never modify or delete it again.
#
# Dogfooding, moved from ci.yml verbatim. It belongs in end2end rather than
# build because it is exactly that: the scanner built from this tree, run
# against a real repository, exercising the scan and report path end to end.
#
# Distinct from the `lydite` stage in ci-orchestration, which runs the last
# RELEASED scanner. This one asks "does the scanner in this PR still work";
# that one asks "does the shipped scanner still pass this repo". Both matter,
# and neither substitutes for the other.
name: ci-end2end

on:
  workflow_call:

permissions:
  contents: read

jobs:
  self-scan:
    name: self-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod's toolchain line. It was restated in five places, which
          # is how one of them goes stale without anyone noticing.
          go-version-file: cli/go.mod
          cache: true

      # Built from cli/ (the module root); the scan below deliberately runs
      # from the repository root, which is the scan root .lydite/config.yml sits at.
      - name: build lydite
        working-directory: cli
        run: go build -o /tmp/lydite ./cmd/lydite

      - name: lydite scan (self)
        run: /tmp/lydite scan --dir .

  # lydite's own repository can exercise one runner. `web/` is empty and the
  # only Cargo.toml files are pin manifests, which are deliberately not
  # components — so without a foreign repository the cargo and vitest runners
  # would merge with their argv asserted and never once executed, which is a
  # check reporting a pass having never run.
  #
  # proving-ground is that repository. It is checked out rather than vendored
  # because lydite has to run against it as a foreign repo: a fixture inside
  # this tree would be scanned as part of lydite.
  proving-ground:
    name: proving ground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lydite/proving-ground
          path: proving-ground
          # --affected resolves a merge-base against origin/main, which a
          # shallow checkout cannot reach. lydite refuses rather than quietly
          # widening or narrowing, so without this the selection step below
          # fails with exactly the message a consumer would get.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true

      # lydite installs the pinned cargo-nextest itself, and building it from
      # source is ~7 minutes. Cached, that is a one-time cost per pin bump
      # rather than a cost per run — which is the same thing consumers are told
      # to cache, so this job runs the arrangement it recommends. Keyed on the
      # pin manifests, so a Dependabot bump misses the cache and installs the
      # version it just pinned rather than reusing the one it replaced.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lydite
          key: lydite-tools-${{ runner.os }}-${{ hashFiles('cli/internal/**/Cargo.toml', 'cli/internal/**/go.mod', 'cli/internal/**/requirements.txt') }}
          restore-keys: lydite-tools-${{ runner.os }}-

      - name: build lydite
        working-directory: cli
        run: go build -o /tmp/lydite ./cmd/lydite

      # Nothing prepares the tree first, and that is the point. lydite installs
      # a JavaScript component's dependencies itself and starts each
      # component's compose services itself, so a step here doing either would
      # hide the case a consumer actually hits. Two of the four components
      # bring up postgres and wait for it to report healthy; ubuntu-latest
      # carries the docker compose plugin the probe finds.
      #
      # The expected verdict is not all-green. `scripts/seed.ts` is under no
      # component and carries no exclude on purpose, so the orphan gate has to
      # fail on it — which is why this asserts the verdict rather than checking
      # for the absence of one. A job that only checked `exit 0` would go green
      # the day the gate stopped working, and that is the failure a proving
      # ground exists to catch. The script also holds every component to a
      # pass, so the expected failure cannot mask a runner that broke.
      - name: lydite test (proving ground)
        run: |
          status=0
          /tmp/lydite test --dir proving-ground --json > report.json || status=$?
          echo "lydite test exited $status"
          cat report.json
          python3 .github/assert-proving-ground.py report.json proving-ground

      # Selection has to be shown to have selected. A run that narrowed
      # wrongly and a run that narrowed correctly are both green and both
      # faster, so the assertion names the components that must NOT have run
      # as well as the ones that must — a selection returning everything
      # satisfies every claim about correctness and delivers none of the value.
      #
      # The probe touches go/api/, which reaches sdk and web only through the
      # declared dependency edge: their clients are generated from the spec api
      # emits, across three languages, and no build tool derives that. This is
      # the case lydite's own unit tests cannot establish, because they supply
      # the declaration they then assert against.
      #
      # It costs one extra run of three of the four components. The fourth
      # case — a lockfile selecting everything — is deliberately not run here:
      # it is exactly the full run the step above already performs, so paying
      # for it twice would buy an assertion the unit tests already hold.
      - name: lydite test --affected (proving ground)
        run: |
          git -C proving-ground config user.email ci@lydite.invalid
          git -C proving-ground config user.name "lydite ci"
          git -C proving-ground switch --quiet -c selection-probe
          # The package name is read from a file already there rather than
          # written down here. Nothing in this repository pins what
          # lydite/proving-ground calls that package, so a hardcoded one is a
          # cross-repo coupling that turns a rename over there into a
          # compilation failure here — reported against lydite, in a step
          # about selection.
          pkg=$(awk '/^package /{print $2; exit}' proving-ground/go/api/api.go)
          if [ -z "$pkg" ]; then
            echo "could not read the package name from proving-ground/go/api/api.go" >&2
            exit 1
          fi
          printf 'package %s\n\n// The selection probe makes a diff under this component, so CI can\n// assert which components a change here selects.\n' "$pkg" \
            > proving-ground/go/api/selection_probe.go
          # The probe file alone, never `add -A`. This step runs in the same
          # checkout as the full run above, so a stray artefact swept into the
          # commit would widen selection — .lydite-reports/** matches no
          # component and a touched lockfile is an invalidator — and the
          # assertion would fail on the harness rather than on lydite. The
          # proving ground gitignores its report directory today, but that is
          # another repository's file to change.
          git -C proving-ground add go/api/selection_probe.go
          git -C proving-ground commit --quiet -m "selection probe"
          status=0
          /tmp/lydite test --dir proving-ground --affected --json > affected.json || status=$?
          echo "lydite test --affected exited $status"
          cat affected.json
          python3 .github/assert-proving-ground.py --affected affected.json proving-ground

      # Each component's whole output, for when the tail under its row is not
      # enough. lydite captures rather than streams, so this is the only copy —
      # which is the trade: a passing run's log stays out of the job log
      # entirely, and a failing one is a download away rather than buried in
      # someone else's container lifecycle.
      - name: collect component logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proving-ground-component-logs
          path: proving-ground/.lydite-reports/
          if-no-files-found: ignore

  # The single job the branch-protection ruleset actually requires. Individual
  # job names (lint, build & test, ...) are an implementation detail that
  # changes as CI evolves — pointing the ruleset at each one means every job
  # rename/add/remove is also a ruleset edit, and a job that's silently never
  # required (as self-scan was here) goes unnoticed. Add a job to `needs:`
  # below and the gate covers it automatically; the ruleset itself never
  # needs to change again.
