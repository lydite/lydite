# ci-end2end — this file is yours.
#
# gt created it once and will never modify or delete it again.
#
# Dogfooding, moved from ci.yml verbatim. It belongs in end2end rather than
# build because it is exactly that: the scanner built from this tree, run
# against a real repository, exercising the scan and report path end to end.
#
# Distinct from the `lydite` stage in ci-orchestration, which runs the last
# RELEASED scanner. This one asks "does the scanner in this PR still work";
# that one asks "does the shipped scanner still pass this repo". Both matter,
# and neither substitutes for the other.
name: ci-end2end

on:
  workflow_call:

permissions:
  contents: read

jobs:
  self-scan:
    name: self-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod's toolchain line. It was restated in five places, which
          # is how one of them goes stale without anyone noticing.
          go-version-file: cli/go.mod
          cache: true

      # Built from cli/ (the module root); the scan below deliberately runs
      # from the repository root, which is the scan root .lydite/config.yml sits at.
      - name: build lydite
        working-directory: cli
        run: go build -o /tmp/lydite ./cmd/lydite

      - name: lydite scan (self)
        run: /tmp/lydite scan --dir .

  # lydite's own repository can exercise one runner. `web/` is empty and the
  # only Cargo.toml files are pin manifests, which are deliberately not
  # components — so without a foreign repository the cargo and vitest runners
  # would merge with their argv asserted and never once executed, which is a
  # check reporting a pass having never run.
  #
  # proving-ground is that repository. It is checked out rather than vendored
  # because lydite has to run against it as a foreign repo: a fixture inside
  # this tree would be scanned as part of lydite.
  proving-ground:
    name: proving ground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lydite/proving-ground
          path: proving-ground

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: true

      - name: build lydite
        working-directory: cli
        run: go build -o /tmp/lydite ./cmd/lydite

      # Nothing prepares the tree first, and that is the point. lydite installs
      # a JavaScript component's dependencies itself and starts each
      # component's compose services itself, so a step here doing either would
      # hide the case a consumer actually hits. Two of the four components
      # bring up postgres and wait for it to report healthy; ubuntu-latest
      # carries the docker compose plugin the probe finds.
      - name: lydite test (proving ground)
        run: /tmp/lydite test --dir proving-ground

  # The single job the branch-protection ruleset actually requires. Individual
  # job names (lint, build & test, ...) are an implementation detail that
  # changes as CI evolves — pointing the ruleset at each one means every job
  # rename/add/remove is also a ruleset edit, and a job that's silently never
  # required (as self-scan was here) goes unnoticed. Add a job to `needs:`
  # below and the gate covers it automatically; the ruleset itself never
  # needs to change again.
