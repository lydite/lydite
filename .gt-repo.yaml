# Repository governance for gt. This file is the source of truth; run
# 'gt repo sync' to render it, and 'gt repo check' to verify.
#
# Shared policy (Dependabot cooldown, commit-message prefixes, the weekly sync
# schedule) lives in gt's templates, not here, so it stays consistent across
# every governed repo.
#
# The pipeline stages below become jobs in ci-orchestration.yml, each calling a
# ci-*/cd-* workflow that belongs to this repository: gt creates those once and
# never touches them again. Branch protection needs exactly one check, ci-gate,
# which waits on all of them.
#
# Only deliberate overrides are written here. Everything absent follows gt's
# default and keeps following it as that default changes — a value pinned in
# this file stops tracking gt, which is why sync removes the ones that merely
# restate it. Run 'gt repo config' to see the resolved spec, defaults included.

gt_version: 1.6.0
dependabot:
  - ecosystem: gomod
    directory: /source/cli
  - ecosystem: github-actions
    directory: /
  - ecosystem: npm
    directory: /source/cli/internal/typescript/biome-pin
    note: |
      Biome (internal/typescript), the only TypeScript linter.

      One of the tool version pins. lydite pins every tool it runs, and these
      manifests exist so those pins are visible to Dependabot rather than frozen
      in Go constants nothing ever ages out — a security scanner that is itself
      years out of date keeps reporting [PASS]. See AGENTS.md, "Tool version
      pins".

      A pin directory is deliberately not a component, so nothing scans or tests
      it. A cargo pin is the exception: cargo refuses a [package] manifest with
      no src/lib.rs, so it carries real Rust that .lydite/components.yml has to
      exclude. Nothing enforces this entry, though, so a pin added without one is
      a pin no bot ever bumps.
  - ecosystem: cargo
    directory: /source/cli/internal/rust/cargo-audit-pin
    note: |
      cargo-audit (internal/rust). One manifest per tool: cargo-audit and
      cargo-deny cannot resolve in a shared dependency graph.
  - ecosystem: cargo
    directory: /source/cli/internal/rust/cargo-deny-pin
    note: |
      cargo-deny (internal/rust).
  - ecosystem: cargo
    directory: /source/cli/internal/runner/cargo-nextest-pin
    note: |
      cargo-nextest (internal/runner), the test runner a component declaring
      the cargo-nextest runner is run with. Pinned for the reason the scanners
      are: whatever version a machine carries decides which tests run and what
      a failure looks like.
  - ecosystem: cargo
    directory: /source/cli/internal/runner/cargo-llvm-cov-pin
    note: |
      cargo-llvm-cov (internal/runner), the instrumentation a Rust component's
      coverage is measured through. Installed rather than assumed on PATH: a
      runner without it measures nothing, and an empty baseline cached as real
      makes every later pull request a cache hit that gates on nothing.
  - ecosystem: gomod
    directory: /source/cli/internal/golang/go-pin
    note: |
      gosec / govulncheck (internal/golang). A bump here must be mirrored into
      golang.go's constants, which go:embed cannot reach because go-pin is a
      nested module. internal/pins holds that rule: its TestNoDrift fails a
      bump that did not carry its mirror, and `go run ./tools/pinsync` writes
      it.

      The allow rules are load-bearing. go-pin has no .go files, so `go mod tidy`
      marks every require — gosec and govulncheck included — as `// indirect`,
      and Dependabot's default allow rule is direct dependencies only. Without
      these, both pins freeze and nothing reports it: pins_test.go only fires
      AFTER a bump lands.

      Named explicitly rather than dependency_type: all across the module: it has
      49 indirect requires (grpc, protobuf, cloud.google.com/go, …) and allowing
      all of them would reintroduce the PR flood that keeping go-pin out of
      lydite's own go.mod exists to avoid.
    allow:
      - dependency_name: github.com/securego/gosec/v2
        dependency_type: all
      - dependency_name: golang.org/x/vuln
        dependency_type: all
  - ecosystem: pip
    directory: /source/cli/internal/semgrep
    note: |
      Semgrep (internal/semgrep).
  - ecosystem: npm
    directory: /source/cloud-services
    note: |
      The Workers lydite operates (source/cloud-services), as one npm
      workspace and therefore one component.

      Not a tool pin: this is a real workspace that is built, tested and
      scanned, so a bump here changes what lydite ships rather than what it
      runs. Nothing it depends on at runtime — WebCrypto covers the whole of
      the cryptography — so every dependency below is a development one.

      @cloudflare/workers-types is deliberately absent, and must stay absent.
      wrangler declares a peer range on it, which is the coupling that removed
      ESLint from lydite: a bump to either side crossing the other's range
      makes `npm ci` fail with ERESOLVE, and the failure lands on whoever runs
      it next rather than on the bump. Nothing here uses a Cloudflare-specific
      type.

      vitest and its coverage provider are grouped because they cannot move
      apart: @vitest/coverage-v8 declares an exact peer on vitest, so bumping
      either alone resolves to nothing. `npm ci` fails with ERESOLVE, the
      component reports `not prepared`, and both pull requests are red for a
      conflict neither of them contains. One group is one pull request carrying
      both halves. It is the workers-types coupling again, met where it cannot
      be avoided: a JavaScript component must declare its own coverage
      provider, and the provider is pinned to its runner.
    groups:
      - name: vitest
        patterns:
          - vitest
          - '@vitest/*'
bulwark:
  enabled: false
pipeline:
  cd:
    enabled: false
